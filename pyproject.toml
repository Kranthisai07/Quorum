[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum"
version = "0.1.0"
description = "Shared-memory coordination layer for concurrent AI agents, built on CockroachDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "psycopg[binary,pool]>=3.2",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34", "anthropic[bedrock]>=0.69"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[project.scripts]
quorum = "quorum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quorum = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["fixtures", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "S", "ARG", "PL"]
ignore = [
    "ANN401",   # Any is occasionally correct for JSONB payloads
    "B008",     # typer uses function calls in argument defaults
    "PLC0415",  # CLI imports lazily on purpose, to keep --help fast
    "PLW0603",  # the connection pool is a documented process singleton
    "PLR0913",  # stdlib-imposed signatures (logging.makeRecord) exceed the cap
    "PLR0917",
    "PLR0915",  # the SQL statement splitter is one long, deliberate loop
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN202", "S101", "S608", "SLF001", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running CockroachDB instance",
]
addopts = "-ra --strict-markers"
timeout = 120
